name: Apply

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 行政事業レビューの URL の追加と差し替えを取り込む。毎月 13 日 04:00 JST に取る（gov_documents の取り込みより前）
    - cron: "0 19 12 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@3152e2a8a30c350f15e5ab15d7a55847fdf0679c
    with:
      dataset_name: soumu
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
