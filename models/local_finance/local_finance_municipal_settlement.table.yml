schema: local_finance
name: municipal_settlement
title: 市町村別決算状況調（市区町村別・年度別・項目別）
description: |-
  総務省「市町村別決算状況調」の Excel を、1 行が 1 団体・1 年度・1 項目の縦持ちにしたテーブルです。2002 年度（平成 14 年度）から最新の年度まで、市区町村（特別区を含む）の普通会計の決算を持ちます。

  - section は元の Excel の表で、概況・歳入内訳・目的別歳出内訳・性質別歳出内訳・地方債現在高等の 5 つです。2006 年度までの町村は、歳入内訳と、歳出と収支をまとめた歳出内訳の 2 つです
  - item は Excel の見出しを親から順に「/」でつないだ項目名です（例: 地方税/うち固定資産税、民生費/児童福祉費）。見出しの番号（一・1・(1)・(ア)）と「内訳」は除いています。項目は年度によって追加・廃止・改称されます
  - 金額は千円です。単位は unit にあります
  - 値が「-」の項目は value が NULL で、value_text に「-」が入ります
  - lg_code は Excel に団体コードがある 2011 年度から入っています。2010 年度までは NULL なので、pref_name と entity_name で団体を特定してください
  - 都道府県計・全国計などの合計の行は入っていません
keywords:
  - 総務省
  - 市町村別決算状況調
  - 地方財政状況調査
  - 地方財政
  - 決算
  - 歳入
  - 歳出
  - 地方債
  - 財政力指数
  - 経常収支比率
  - 市区町村
primary_key: [fiscal_year, pref_name, entity_name, section, item]
sources:
  - path: https://www.soumu.go.jp/iken/kessan_jokyo_2.html
fields:
  - name: fiscal_year
    title: 決算年度（西暦）
  - name: entity_group
    title: 区分（都市・町村）
    description: Excel の区分。都市 は市と特別区、町村 は町と村
  - name: area_code
    title: 標準地域コード（5桁）
    description: lg_code の先頭 5 桁。2010 年度までは NULL
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: lg_code
    title: 全国地方公共団体コード（6桁）
    description: Excel の団体コード（6 桁・チェックデジット付き）。2010 年度までは Excel に団体コードが無いので NULL
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: pref_name
    title: 都道府県名
  - name: entity_name
    title: 団体名
    description: その年度の Excel の団体名。同じ都道府県に同じ名前の町村があった年度は「一宮町・宍粟」のように郡名が付いています
  - name: section
    title: 表
    description: Excel の表の名前（概況・歳入内訳・目的別歳出内訳・性質別歳出内訳・地方債現在高等・歳出内訳）
  - name: item
    title: 項目
    description: Excel の見出しを親から順に「/」でつないだ項目名。「うち」で始まる項目は、左の項目の内数
  - name: unit
    title: 単位
    description: 千円・人・%・km2。財政力指数は NULL
  - name: value
    title: 値
  - name: value_text
    title: 数値でない値
    description: Excel のセルが数値でないときの値（「-」など）。数値のときは NULL
  - name: source_url
    title: 出典の Excel の URL
  - name: page_url
    title: 出典の年度のページの URL
