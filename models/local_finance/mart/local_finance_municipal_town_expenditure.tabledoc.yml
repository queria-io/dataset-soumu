$schema: https://tabledoc.queria.io/schemas/table/v1.json
title: 市町村別決算状況調 町村の歳出（2006 年度まで）（市区町村別・年度別）
description: |-
  総務省「市町村別決算状況調」の Excel の「歳出内訳」の表を、1 行が 1 団体・1 年度、列が項目の横持ちにしたテーブルです。2006 年度までの町村の Excel にある、目的別・性質別の歳出と地方債現在高などをまとめた表を持ちます。

  - 値は municipal_settlement の value と同じです。列名は municipal_settlement の item で、見出しを親から順に「/」でつないだ名前です
  - 列は最新の年度の Excel の並びで、最新の年度に無い項目はその後ろにあります。項目は年度によって追加・廃止・改称されるので、その年度の Excel に無い項目は NULL です
  - 「-」などの数値でないセルは NULL です。数値でない値と単位は municipal_settlement にあります
  - 2006 年度までの Excel には団体コードが無いので、lg_code と area_code はすべて NULL です。その年度のコードは codh.city.municipality（歴史的行政区域）と都道府県名・団体名・有効期間で結合すると引けます
  - 2007 年度からは、目的別歳出内訳・性質別歳出内訳・地方債現在高等の 3 つの表に分かれています（municipal_expenditure_by_purpose・municipal_expenditure_by_nature・municipal_debt）
topics:
  - 総務省
  - 市町村別決算状況調
  - 地方財政
  - 決算
  - 歳出
  - 町村
  - 市区町村
primary_key: [fiscal_year, pref_name, entity_name]
sources: [kessan_jokyo_2]
columns:
  - name: fiscal_year
    title: 決算年度（西暦）
  - name: entity_group
    title: 区分（都市・町村）
    description: Excel の区分。都市 は市と特別区、町村 は町と村
    dimension: categorical
  - name: area_code
    title: 標準地域コード（5桁）
    description: lg_code の先頭 5 桁。2010 年度までは NULL
    entity: city
  - name: lg_code
    title: 全国地方公共団体コード（6桁）
    description: Excel の団体コード（6 桁・チェックデジット付き）。2010 年度までは Excel に団体コードが無いので NULL
    entity: city
  - name: pref_name
    title: 都道府県名
  - name: entity_name
    title: 団体名
    description: その年度の Excel の団体名。同じ都道府県に同じ名前の町村があった年度は「一宮町・宍粟」のように郡名が付いています
  - name: page_url
    title: 出典の年度のページの URL
