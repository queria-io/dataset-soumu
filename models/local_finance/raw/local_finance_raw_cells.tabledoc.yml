    title: 元の Excel の sha256
    description: source_file の sha256
  - name: source_sheet
    title: 元の Excel のシート名
  - name: source_row
    title: 行番号
    description: 1 から数えた行番号
  - name: col_no
    title: 列番号
    description: 1 から数えた列番号（A 列が 1）
  - name: value
    title: セルの値
    description: Excel のセルの値の文字。数値は Excel が持つ値をそのまま文字にしています
