[project]
name = "dataset-soumu"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fdl-cli>=0.19.0",
    "dbt-core>=1.11.2",
    "dbt-duckdb>=1.10.0",
    "pymupdf>=2.1",
    "duckdb>=1.5.6",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["duckdb>=1.4"]

# dbt の Python モデルが pipelines を import できるよう、このリポジトリを venv に入れる
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]
