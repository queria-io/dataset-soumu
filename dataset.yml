# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
name: soumu
title: 総務省
description: |-
  総務省のウェブサイト（www.soumu.go.jp）が公開する資料のデータセットです。

  - plans: 行政事業レビューのシートが関係する計画・通知等として挙げる総務省のサイトの PDF を、ページごとの本文で持ちます。毎月、シートの URL を取り直します
  - local_finance: 市町村別決算状況調の Excel（2002 年度から）を、市区町村・年度・項目ごとの縦持ちと、表ごとの横持ちで持ちます

  出典：行政事業レビュー見える化サイト（https://rssystem.go.jp）、総務省ウェブサイト（https://www.soumu.go.jp/）の各資料、総務省「市町村別決算状況調」を加工して作成
keywords:
  - 総務省
  - 行政事業レビュー
  - 計画・通知等
  - 市町村別決算状況調
  - 地方財政
homepage: https://github.com/queria-io/dataset-soumu
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 行政事業レビュー見える化サイト（行政改革推進本部事務局）
    path: https://rssystem.go.jp
  - title: 総務省ウェブサイト
    path: https://www.soumu.go.jp/
  - title: 市町村別決算状況調（総務省）
    path: https://www.soumu.go.jp/iken/kessan_jokyo_2.html

contributors:
  - title: 総務省
    path: https://www.soumu.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: plans
    title: 計画・通知等
  - name: local_finance
    title: 地方財政

annotations:
  queria:
    themes: [government_finance]
    cover: 🏛️
